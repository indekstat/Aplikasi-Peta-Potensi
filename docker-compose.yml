services:
  db:
    image: postgres:16-alpine
    container_name: petapotensi_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=petapotensi
      - POSTGRES_USER=petapotensi
      - POSTGRES_PASSWORD=petapotensi123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petapotensi"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: petapotensi_backend
    ports:
      - "7031:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=petapotensi
      - DB_USER=petapotensi
      - DB_PASSWORD=petapotensi123
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: petapotensi_frontend
    ports:
      - "1307:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=production
      - API_URL=http://backend:8000
    command: sh -c "npm run build && npm start"
    depends_on:
      - backend

volumes:
  postgres_data:
